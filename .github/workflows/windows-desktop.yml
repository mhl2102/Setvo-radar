name: Setvo Windows - testes e instalador
on:
  workflow_dispatch:
    inputs:
      assinar:
        description: 'Assinar com Microsoft Artifact Signing (requer conta e identidade verificadas)'
        type: boolean
        required: true
        default: false
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'web/**'
      - 'config.yaml'
      - 'requirements*.txt'
      - 'installer/**'
      - '.github/workflows/windows-desktop.yml'
permissions:
  contents: read
  id-token: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt
      - name: Testes automatizados
        run: python -m unittest discover -s tests -v
      - name: Gerar executável portátil Windows
        run: |
          pyinstaller --noconfirm --clean --noupx --onedir --windowed --name Setvo --collect-all webview --add-data "web;web" --add-data "config.yaml;." desktop.py
      - name: Autenticar Microsoft Artifact Signing (somente distribuicao assinada)
        if: ${{ inputs.assinar }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Assinar executavel Setvo.exe com identidade verificada
        if: ${{ inputs.assinar }}
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\dist\Setvo\Setvo.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verificar assinatura do executavel
        if: ${{ inputs.assinar }}
        run: |
          $exe = Join-Path $PWD 'dist\Setvo\Setvo.exe'
          $sig = Get-AuthenticodeSignature -FilePath $exe
          if ($sig.Status -ne 'Valid') { throw "Assinatura do Setvo.exe nao e valida: $($sig.Status)" }
      - name: Homologação do executável sem interface
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'SetvoDesktopSmoke'
          $exe = Join-Path $PWD 'dist\Setvo\Setvo.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Smoke test falhou ($($process.ExitCode))" }
      - name: Verificar bibliotecas essenciais e orientar uso portatil
        run: |
          $app = Join-Path $PWD 'dist\Setvo'
          foreach ($file in @('Setvo.exe', '_internal\python312.dll')) {
            $item = Join-Path $app $file
            if (-not (Test-Path $item -PathType Leaf)) { throw "Arquivo essencial ausente: $file" }
          }
          @(
            'SETVO - VERSAO PORTATIL WINDOWS'
            ''
            '1. Clique com o botao direito no ZIP baixado do GitHub e selecione EXTRair TUDO.'
            '2. Abra a pasta extraida, onde estao Setvo.exe e _internal.'
            '3. Execute Setvo.exe. Nao abra o programa visualizando o ZIP no Explorador.'
            '4. Nao mova Setvo.exe isoladamente: ele depende da pasta _internal.'
            ''
            'Se apareceu Failed to load Python DLL python312.dll, extraia o arquivo novamente.'
            'Alternativa recomendada: baixe o artefato SETVO-INSTALADOR no GitHub.'
          ) | Set-Content (Join-Path $app 'LEIA_PRIMEIRO.txt') -Encoding utf8
      - name: Simular extracao ZIP e testar app em outra pasta
        run: |
          $pacote = Join-Path $env:RUNNER_TEMP 'teste-portatil.zip'
          $pasta = Join-Path $env:RUNNER_TEMP 'Setvo Extraido'
          Compress-Archive -Path 'dist\Setvo\*' -DestinationPath $pacote -Force
          Expand-Archive -Path $pacote -DestinationPath $pasta -Force
          if (-not (Test-Path (Join-Path $pasta '_internal\python312.dll'))) { throw 'python312.dll ausente apos a extracao' }
          $p = Start-Process -FilePath (Join-Path $pasta 'Setvo.exe') -ArgumentList '--self-test' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "Falhou o teste apos extracao: $($p.ExitCode)" }
      - name: Instalar compilador do instalador (Inno Setup)
        run: choco install innosetup --yes --no-progress
      - name: Gerar instalador Windows
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" 'installer\Setvo.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou ($LASTEXITCODE)" }
      - name: Assinar instalador com identidade verificada (somente distribuicao assinada)
        if: ${{ inputs.assinar }}
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verificar assinatura do instalador (somente distribuicao assinada)
        if: ${{ inputs.assinar }}
        run: |
          $instaladores = @(Get-ChildItem -Path 'release' -Filter '*.exe')
          if ($instaladores.Count -eq 0) { throw 'Instalador nao encontrado' }
          foreach ($arquivo in $instaladores) {
            $assinatura = Get-AuthenticodeSignature -FilePath $arquivo.FullName
            if ($assinatura.Status -ne 'Valid') { throw "Assinatura invalida em $($arquivo.Name): $($assinatura.Status)" }
          }
      - name: Verificacao antivirus quando Microsoft Defender esta disponivel
        run: |
          $report = 'Defender indisponivel neste runner: verificacao antivirus nao executada.'
          $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
          if ($null -ne $status -and $status.AntivirusEnabled) {
            Start-MpScan -ScanType CustomScan -ScanPath (Join-Path $PWD 'dist\Setvo') -ErrorAction Stop
            Start-MpScan -ScanType CustomScan -ScanPath (Join-Path $PWD 'release') -ErrorAction Stop
            $report = 'Microsoft Defender: exames solicitados e concluidos sem erro.'
          }
          $report | Set-Content -Path 'ANTIVIRUS_SCAN.txt' -Encoding utf8
          Write-Host $report
      - name: Gerar hashes SHA-256 e status da assinatura
        run: |
          $arquivos = @((Get-Item 'dist\Setvo\Setvo.exe')) + @(Get-ChildItem 'release' -Filter '*.exe')
          if ($arquivos.Count -lt 2) { throw 'Arquivos para verificacao nao encontrados' }
          $hashes = foreach ($arquivo in $arquivos) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $arquivo.FullName).Hash.ToLowerInvariant()
            "$hash  $($arquivo.Name)"
          }
          $hashes | Set-Content -Path 'SHA256SUMS.txt' -Encoding ascii
          $assinatura = Get-AuthenticodeSignature -FilePath 'dist\Setvo\Setvo.exe'
          "Setvo.exe: $($assinatura.Status)" | Set-Content 'ASSINATURA_STATUS.txt' -Encoding utf8
          foreach ($instalador in (Get-ChildItem 'release' -Filter '*.exe')) {
            $sig = Get-AuthenticodeSignature -FilePath $instalador.FullName
            "$($instalador.Name): $($sig.Status)" | Add-Content 'ASSINATURA_STATUS.txt'
          }
          Get-Content 'SHA256SUMS.txt'
          Get-Content 'ASSINATURA_STATUS.txt'
      - name: Publicar instalador Windows (recomendado)
        uses: actions/upload-artifact@v4
        with:
          name: SETVO-INSTALADOR-${{ inputs.assinar && 'ASSINADO' || 'PREVIEW-NAO-ASSINADO' }}
          path: |
            release/*.exe
            SHA256SUMS.txt
            ASSINATURA_STATUS.txt
            ANTIVIRUS_SCAN.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publicar portatil Windows (somente um ZIP, sem ZIP dentro de ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: SETVO-PORTATIL-EXTRAIR-TUDO
          path: dist/Setvo/
          if-no-files-found: error
          retention-days: 14
